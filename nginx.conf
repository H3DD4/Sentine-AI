events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ─── Upstream: FastAPI backend ────────────────────────────────
    upstream backend {
        server host.docker.internal:8003;
    }

    # ─── Rate limiting zones ──────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # ─── HTTP → HTTPS redirect (uncomment when TLS is configured) ─
    # server {
    #     listen 80;
    #     server_name your-public-domain.com;
    #     return 301 https://$host$request_uri;
    # }

    server {
        listen 80;
        listen [::]:80;
        server_name _;  # Replace with your public domain or IP

        # ─── Security headers ─────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" if {$scheme = https};

        # ─── Request size limits ──────────────────────────────────
        client_max_body_size 100M;
        proxy_request_buffering off;

        # ─── Logging ──────────────────────────────────────────────
        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log warn;

        # ─── Health check ─────────────────────────────────────────
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # ─── Static files (frontend build) ────────────────────────
        location /static/ {
            proxy_pass http://backend/static/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_valid 200 1h;
            add_header Cache-Control "public, max-age=3600";
        }

        # ─── API routes ───────────────────────────────────────────
        location ~ ^/(chat|validate|findings|reports|ghostwriter|kb|engagements|settings|audit)/ {
            limit_req zone=api_limit burst=50 nodelay;
            limit_conn conn_limit 20;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout    60s;
            proxy_read_timeout    120s;
            send_timeout          60s;
        }

        # ─── API docs ─────────────────────────────────────────────
        location /docs {
            proxy_pass http://backend/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /openapi.json {
            proxy_pass http://backend/openapi.json;
            proxy_set_header Host $host;
        }

        # ─── Root: SPA entry point ────────────────────────────────
        location / {
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ─── Deny access to hidden files ──────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}